[build-system]
requires = [
    "setuptools>=71,<72; python_version < '3.9'",
    "setuptools>=77; python_version >= '3.9'",
    "wheel",
    "Cython>=3.1,<3.2",
]
build-backend = "setuptools.build_meta"

[project]
name = "myapp"
version = "0.10.0"
description = "PyStand2 example application"
requires-python = ">=3.8,<3.14"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pstand]
# Bundled target/runtime Python. This is independent from the Python used to
# run tools/build.py. Set it to the exact runtime you want to ship.
python = "3.13"
entry = "myapp"

[tool.pstand.runtime]
# Runtime is independent from the Python used to run tools/build.py.
# provider = "pbs" uses python-build-standalone.
# provider = "local" lets you supply a prebuilt target runtime + SDK.
provider = "pbs"
python = "3.13"

# Used only by provider = "local". Paths may contain {target}, {arch}, {python}.
# runtime = "runtimes/{target}/{python}"
# sdk = "runtimes/{target}/{python}-sdk"

[tool.pstand.pbs]
release = "20260929"

[tool.pstand.cython]
include = ["myapp.core.*", "myapp.services.*", "myapp.models.*"]
exclude = ["myapp.config", "myapp.logging"]

[tool.pstand.windows]
architectures = ["x86", "x86_64", "arm64"]

[tool.pstand.macos]
architectures = ["arm64", "x86_64"]

[tool.pstand.linux]
architectures = ["x86_64", "arm64"]
