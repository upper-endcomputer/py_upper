name: py_upper validation

on:
  push:
  pull_request:

jobs:
  build-tool-compat:
    name: Build Tool Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify Build Tool imports
        run: |
          python -m py_compile $(find tools/py_upper -name '*.py' -print)
          python -c "import sys; sys.path.insert(0, 'tools'); import py_upper.config; import py_upper.compat; print(sys.version)"
      - name: Run compatibility tests
        run: |
          python -m pip install -U 'pip<25.1' 'pytest<8'
          python -m pytest app/tests/test_build_tool_compat.py app/tests/test_py_upper_config.py -q

  native-integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            run: true
          - os: ubuntu-24.04-arm
            target: linux-arm64
            run: false
          - os: windows-2025
            target: windows-x86
            run: false
          - os: windows-2025
            target: windows-x86_64
            run: true
          - os: windows-11-arm
            target: windows-arm64
            run: true
          - os: macos-15-intel
            target: macos-x86_64
            run: true
          - os: macos-14
            target: macos-arm64
            run: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache py_upper build inputs
        uses: actions/cache@v4
        with:
          path: |
            .cache/pbs
            .cache/pip
            build/wheels
          key: py-upper-v0.17.4-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('app/pyproject.toml') }}

      - name: Install Python build tools
        run: python -m pip install -U pip setuptools wheel 'Cython>=3.1,<3.3' pytest

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ binutils

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          cmake --version
          if ! command -v ninja >/dev/null 2>&1; then brew install ninja; fi
          ninja --version

      - name: Verify Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmake --version

      - name: Unit tests
        run: python -m pytest app/tests -q

      - name: Local end-to-end build with third-party wheel
        env:
          PY_UPPER_E2E: '1'
        run: python -m pytest app/tests/test_e2e_local.py -q

      - name: Doctor
        run: python tools/build.py --doctor --target ${{ matrix.target }}

      - name: Full integration build
        run: python tools/build.py --target ${{ matrix.target }}

      - name: Full integration run
        if: matrix.run == true
        env:
          PY_UPPER_HEADLESS: '1'
        run: |
          python tools/build.py --run --target ${{ matrix.target }} > run.log 2>&1
          python -c "import pathlib, sys; text = pathlib.Path('run.log').read_text(encoding='utf-8', errors='replace'); print(text[-3000:]); sys.exit(0 if 'GUI OK' in text else 1)"

      - name: Validate packaged release manifest inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('dist')
          files = [p for p in root.rglob('*') if p.is_file()]
          assert files, 'dist is empty'
          for p in files:
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              assert len(h) == 64
          print(f'validated {len(files)} packaged files')
          PY

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: py-upper-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  aggregate-artifacts:
    needs: native-integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: py-upper-*
          path: collected
          merge-multiple: false

      - name: Build aggregate release manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import tomllib

          root = Path('collected')
          project = tomllib.loads(Path('app/pyproject.toml').read_text(encoding='utf-8'))['project']
          entries = []
          for artifact in sorted(p for p in root.iterdir() if p.is_dir()):
              target = artifact.name.removeprefix('py-upper-')
              dist = artifact / 'dist'
              if not dist.exists():
                  dist = artifact
              files = []
              for path in sorted(p for p in dist.rglob('*') if p.is_file()):
                  files.append({
                      'path': path.relative_to(dist).as_posix(),
                      'size': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  })
              entries.append({'target': target, 'files': files})

          data = {
              'format': 1,
              'project': 'py_upper',
              'version': str(project['version']),
              'targets': entries,
          }
          Path('collected/release-manifest.json').write_text(
              json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({'version': data['version'], 'targets': [x['target'] for x in entries]}, indent=2))
          assert len(entries) == 7, f'expected 7 native targets, got {len(entries)}'
          PY

      - name: Upload aggregate validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: py-upper-release-manifest
          path: collected/release-manifest.json
          if-no-files-found: error
          retention-days: 30
