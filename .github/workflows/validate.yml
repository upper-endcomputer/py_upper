name: PyStand2 validation

on:
  push:
  pull_request:

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            cross: false
          - os: windows-2025
            target: windows-x86_64
            cross: false
          - os: macos-15-intel
            target: macos-x86_64
            cross: false
          - os: macos-14
            target: macos-arm64
            cross: false
          - os: ubuntu-24.04
            target: linux-arm64
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          # CI may use any supported host Python; it is intentionally not
          # required to equal tool.pstand.python.
      - name: Install build tools
        run: python -m pip install -U pip setuptools wheel Cython pytest
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++
          if [ '${{ matrix.target }}' = 'linux-arm64' ]; then sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu; fi
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
      - name: Tooling tests
        run: python -m pytest app/tests/test_pstand_config.py -q
      - name: Doctor
        run: python tools/build.py --doctor --target ${{ matrix.target }}
      - name: Full build
        if: matrix.cross == true
        run: python tools/build.py --target ${{ matrix.target }}
      - name: Full build and run
        if: matrix.cross != true
        run: python tools/build.py --run --target ${{ matrix.target }}
