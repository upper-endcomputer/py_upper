name: py_upper validation

on:
  push:
  pull_request:
  # Manual re-runs from the CLI (gh workflow run validate.yml --ref develop)
  # and from the Actions page, so a failing job can be reproduced without
  # pushing an empty commit.
  workflow_dispatch:

jobs:
  build-tool-compat:
    name: Build Tool Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # app/pyproject.toml is the Git-ignored working copy; the repository ships
      # app/pyproject.toml.example.
      - name: Create the local configuration from the template
        run: python -c "import shutil; shutil.copyfile('app/pyproject.toml.example', 'app/pyproject.toml')"
      - name: Verify Build Tool imports
        run: |
          python -m py_compile $(find tools/py_upper -name '*.py' -print)
          python -c "import sys; sys.path.insert(0, 'tools'); import py_upper.config; import py_upper.compat; print(sys.version)"
      - name: Run compatibility tests
        run: |
          python -m pip install -U 'pip<25.1' 'pytest<8'
          python -m pytest app/tests/test_build_tool_compat.py app/tests/test_py_upper_config.py -q

  native-integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            run: true
          - os: ubuntu-24.04-arm
            target: linux-arm64
            run: false
          - os: windows-2025
            target: windows-x86
            run: false
            # PySide6 publishes no 32-bit Windows wheel, so this job proves the
            # 32-bit toolchain, launcher and packaging path with the one
            # application dependency that does resolve for win32.
            dependencies: '["pyserial==3.5"]'
          - os: windows-2025
            target: windows-x86_64
            run: true
          - os: windows-11-arm
            target: windows-arm64
            run: true
          - os: macos-15-intel
            target: macos-x86_64
            run: true
          - os: macos-14
            target: macos-arm64
            run: true
    runs-on: ${{ matrix.os }}
    env:
      # Resolving the PBS runtime asks api.github.com, which caps anonymous
      # requests at 60 per hour per source address — a limit the hosted runners
      # share with every other job on the platform. The token raises it.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # app/pyproject.toml is the Git-ignored working copy; the repository ships
      # app/pyproject.toml.example, which pins no dependencies on purpose so a
      # fork never inherits someone else's. This job builds and runs the
      # repository's own application, so it materializes the copy with the
      # dependency set that application needs; the other jobs only need the file
      # to exist.
      - name: Create the local configuration with the repository's dependencies
        # The default shell on Windows runners is pwsh, which cannot run the
        # heredoc below ("<" is reserved). Bash ships with Git for Windows, so
        # every platform can run the same script.
        shell: bash
        env:
          # The application's own dependency set, unless the matrix entry
          # overrides it because no wheel of it exists for that target.
          PY_UPPER_CI_DEPENDENCIES: ${{ matrix.dependencies || '["PySide6==6.11.0", "pyserial==3.5", "bleak==3.0.2", "qasync==0.28.0"]' }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          dependencies = os.environ['PY_UPPER_CI_DEPENDENCIES']
          text = Path('app/pyproject.toml.example').read_text(encoding='utf-8')
          text, replaced = re.subn(
              r'^dependencies = \[\]$',
              f'dependencies = {dependencies}',
              text,
              count=1,
              flags=re.M,
          )
          assert replaced == 1, 'app/pyproject.toml.example must declare an empty dependencies list'
          Path('app/pyproject.toml').write_text(text, encoding='utf-8')
          PY

      - name: Cache py_upper build inputs
        uses: actions/cache@v4
        with:
          path: |
            .cache/pbs
            .cache/pip
            build/wheels
          key: py-upper-v0.17.5-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('app/pyproject.toml', 'app/pyproject.toml.example') }}

      - name: Install Python build tools
        run: python -m pip install -U pip setuptools wheel 'Cython>=3.1,<3.3' pytest

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ binutils
          # The bundled Qt GUI libraries link libEGL.so.1, which the runner
          # image does not carry (libGL.so.1 and libxkbcommon.so.0 it does).
          # Both the Qt pruning probe and the packaged smoke run load it.
          sudo apt-get install -y libegl1

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          cmake --version
          if ! command -v ninja >/dev/null 2>&1; then brew install ninja; fi
          ninja --version

      - name: Unit tests
        run: python -m pytest app/tests -q

      - name: Local end-to-end build with third-party wheel
        env:
          PY_UPPER_E2E: '1'
        run: python -m pytest app/tests/test_e2e_local.py -q

      - name: Doctor
        run: python tools/build.py --doctor --target ${{ matrix.target }}

      - name: Full integration build
        run: python tools/build.py --target ${{ matrix.target }}

      - name: Full integration run
        if: matrix.run == true
        env:
          PY_UPPER_HEADLESS: '1'
          # A failed launcher must exit non-zero, never block the job on a
          # native error dialog that nobody can dismiss.
          PY_UPPER_NO_DIALOG: '1'
        run: |
          python tools/build.py --run --target ${{ matrix.target }} > run.log 2>&1
          python -c "import pathlib, sys; text = pathlib.Path('run.log').read_text(encoding='utf-8', errors='replace'); print(text[-3000:]); sys.exit(0 if 'GUI OK' in text else 1)"

      - name: Validate packaged release manifest inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('dist')
          files = [p for p in root.rglob('*') if p.is_file()]
          assert files, 'dist is empty'
          for p in files:
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              assert len(h) == 64
          print(f'validated {len(files)} packaged files')
          PY

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: py-upper-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  aggregate-artifacts:
    needs: native-integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # app/pyproject.toml is the Git-ignored working copy; the repository ships
      # app/pyproject.toml.example.
      - name: Create the local configuration from the template
        run: python -c "import shutil; shutil.copyfile('app/pyproject.toml.example', 'app/pyproject.toml')"

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: py-upper-*
          path: collected
          merge-multiple: false

      - name: Build aggregate release manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import tomllib

          root = Path('collected')
          project = tomllib.loads(Path('app/pyproject.toml').read_text(encoding='utf-8'))['project']
          entries = []
          for artifact in sorted(p for p in root.iterdir() if p.is_dir()):
              target = artifact.name.removeprefix('py-upper-')
              dist = artifact / 'dist'
              if not dist.exists():
                  dist = artifact
              files = []
              for path in sorted(p for p in dist.rglob('*') if p.is_file()):
                  files.append({
                      'path': path.relative_to(dist).as_posix(),
                      'size': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  })
              entries.append({'target': target, 'files': files})

          data = {
              'format': 1,
              'project': 'py_upper',
              'version': str(project['version']),
              'targets': entries,
          }
          Path('collected/release-manifest.json').write_text(
              json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({'version': data['version'], 'targets': [x['target'] for x in entries]}, indent=2))
          assert len(entries) == 7, f'expected 7 native targets, got {len(entries)}'
          PY

      - name: Upload aggregate validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: py-upper-release-manifest
          path: collected/release-manifest.json
          if-no-files-found: error
          retention-days: 30
