name: PyStand2 validation

on:
  push:
  pull_request:

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: windows-2025
            target: windows-x86_64
          - os: macos-13
            target: macos-x86_64
          - os: macos-14
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install -U pip setuptools wheel Cython
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc g++
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
      - name: Doctor
        run: python tools/build.py --doctor --target ${{ matrix.target }}
      - name: Full build and run
        run: python tools/build.py --run --target ${{ matrix.target }}
