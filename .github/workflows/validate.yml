name: PyStand2 validation

on:
  push:
  pull_request:

jobs:
  native-integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-2025
            target: windows-x86_64
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-14
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache PyStand build inputs
        uses: actions/cache@v4
        with:
          path: |
            .cache/pbs
            build/wheels
          key: pystand-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('app/pyproject.toml') }}

      - name: Install Python build tools
        run: python -m pip install -U pip setuptools wheel 'Cython>=3.1,<3.2' pytest

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ binutils

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          cmake --version
          ninja --version || brew install ninja

      - name: Verify Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmake --version

      - name: Unit tests
        run: python -m pytest app/tests -q

      - name: Doctor
        run: python tools/build.py --doctor --target ${{ matrix.target }}

      - name: Full integration build and run
        run: python tools/build.py --run --target ${{ matrix.target }}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: pystand-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
